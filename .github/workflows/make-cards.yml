name: 做卡片 → 房源池

# 手动触发（Actions 页面点 Run workflow），或由 Claude 定时任务用 `gh workflow run` 触发。
# 输入 Rightmove 链接（每行一个），自动：抓数据和照片 → 出卡片 JPG → 写入房源池 Supabase → 卡片存回仓库 cards/out/<日期>/
on:
  # 每月 1 号 03:10 UTC 自动清理：删除上传超过 90 天的房源（见下面 schedule 分支）
  schedule:
    - cron: '10 3 1 * *'
  workflow_dispatch:
    inputs:
      urls:
        description: 'Rightmove 链接，每行一个；可在链接后空一格加邮编，如 https://www.rightmove.co.uk/properties/94028853 E14（已入池的会自动跳过）'
        required: false
        type: string
        default: ''
      delete_ids:
        description: '要从房源池删除的记录 id（card-…，空格分隔），用于清理重复'
        required: false
        type: string
        default: ''
      delete_oldest:
        description: '删除房源池里最早上传的 N 条（清旧房源；0 = 不删）'
        required: false
        type: string
        default: '0'
      delete_older_than:
        description: '删除上传超过 N 天的全部房源（0 = 不删；每月 1 号自动按 90 天跑）'
        required: false
        type: string
        default: '0'
      save:
        description: '写入房源池（Supabase）'
        required: true
        type: boolean
        default: true
      month_format:
        description: '入住月字段格式：legacy = 现在/7/8/9/10+（线上旧版）；ym = 现在/YYYY-MM（新版 pool.html）'
        required: false
        type: choice
        options: [legacy, ym]
        default: ym

permissions:
  contents: write

concurrency:
  group: make-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 中文字体 + poppler 的安装包缓存：第一次在线装成功后存起来，以后直接用，不再连 Ubuntu 软件源
      - name: 恢复安装包缓存
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          export DEBIAN_FRONTEND=noninteractive
          DEB="$HOME/apt-debs"; mkdir -p "$DEB/partial"
          PKGS="fonts-noto-cjk poppler-utils"
          have_all() { command -v pdftotext >/dev/null && command -v pdfimages >/dev/null && fc-list | grep -q "Noto Sans CJK"; }

          # 1) 有缓存：直接装本地安装包，不联网
          if ls "$DEB"/*.deb >/dev/null 2>&1; then
            echo "使用缓存安装包 $(ls "$DEB"/*.deb | wc -l) 个"
            sudo dpkg -i "$DEB"/*.deb >/dev/null || echo "缓存安装包不完整，改为在线安装"
          fi

          # 2) 在线安装：每次最多 3 分钟；失败就换软件源再试，共 3 次
          if ! have_all; then
            APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dir::Cache::archives=$DEB -o APT::Keep-Downloaded-Packages=true"
            for i in 1 2 3; do
              if [ "$i" = 2 ]; then MIRROR="http://archive.ubuntu.com/ubuntu"; fi
              if [ "$i" = 3 ]; then MIRROR="http://mirrors.edge.kernel.org/ubuntu"; fi
              if [ "$i" != 1 ]; then
                echo "第 $i 次：换软件源 $MIRROR"
                sudo sed -i -E "s#http://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu/?#$MIRROR/#g; s#http://mirrors\.edge\.kernel\.org/ubuntu/?#$MIRROR/#g" /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
              fi
              timeout 120 $APT update -qq || true
              if timeout 180 $APT install -y -f -q --no-install-recommends $PKGS > /dev/null; then echo "第 $i 次安装成功"; break; fi
              echo "第 $i 次安装失败或超时"
            done
            sudo rm -f "$DEB/lock"; sudo chown -R "$(id -u):$(id -g)" "$DEB"
          fi

          # 3) 中文字体兜底：软件源还是装不上，就从 GitHub 直接下载字体文件
          if ! fc-list | grep -q "Noto Sans CJK"; then
            echo "软件源装字体失败，改从 GitHub 下载"
            mkdir -p "$HOME/.local/share/fonts"
            for w in Regular Bold; do
              curl -fsSL --retry 3 --max-time 180 -o "$HOME/.local/share/fonts/NotoSansCJK-$w.ttc" \
                "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC/NotoSansCJK-$w.ttc" || echo "下载 $w 失败"
            done
            fc-cache -f > /dev/null
          fi

          pip install -q playwright requests pillow
          timeout 600 python -m playwright install --with-deps chromium
          which pdftotext pdfimages && fc-list | grep -c "CJK" 

      - name: 写入链接文件
        run: |
          printf '%s\n' "${{ inputs.urls || '' }}" > urls.txt
          echo "共 $(grep -c properties urls.txt || true) 个链接"

      - name: 出卡片 + 写入房源池
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MONTH_FORMAT: ${{ inputs.month_format || 'ym' }}
        run: |
          OUT="cards/out/$(TZ=Europe/London date +%Y%m%d-%H%M)"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          SAVE=""
          if [ "${{ inputs.save }}" = "true" ]; then SAVE="--save"; fi
          OLDER="${{ inputs.delete_older_than || '0' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then OLDER=90; fi
          python cards/make_cards.py --urls urls.txt --out "$OUT" $SAVE --delete "${{ inputs.delete_ids || '' }}" --delete-oldest "${{ inputs.delete_oldest || '0' }}" --delete-older-than "$OLDER"
          mkdir -p "$OUT"; [ -f "$OUT/cards.json" ] || echo '[]' > "$OUT/cards.json"

      - name: 卡片存回仓库
        run: |
          git config user.name "niko-cards-bot"
          git config user.email "cards@nikorelocation.co.uk"
          git add -f "$OUT"
          git commit -m "cards: $(basename "$OUT") ($(ls "$OUT"/*.jpg 2>/dev/null | wc -l) 张)" || echo "无新文件"
          git pull --rebase -q origin main || true
          git push

      - name: 结果摘要
        run: |
          echo "## 本次卡片" >> "$GITHUB_STEP_SUMMARY"
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          for r in json.load(open(os.path.join(os.environ['OUT'], 'cards.json'))):
              if 'error' in r:
                  print(f"- ✗ {r['link']} — {r['error']}"); continue
              if r.get('duplicate'):
                  print(f"- ⟳ {r['link']} — 已在房源池（{r.get('first_folder')}），未重复上传"); continue
              s = '已入池' if r.get('saved') else ('未写库' if not r.get('save_error') else '写库失败: ' + r['save_error'])
              print(f"- {r['address']} · {r['bed_label']} · £{r['weekly']}/周 · 起租 {r['avail']} · {s}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: cards
          path: ${{ env.OUT }}
