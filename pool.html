*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f5f3ef;color:#1a1a1a;min-height:100vh}

/* Header */
header{background:#1a1a1a;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{color:#fff;font-size:15px;font-weight:500;letter-spacing:.5px}
.logo em{color:#c8a96e;font-style:normal}
.add-btn{background:#c8a96e;color:#1a1a1a;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}

/* Filter */
.filter-bar{background:#fff;padding:10px 16px;border-bottom:1px solid #ece9e4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fl{font-size:11px;color:#bbb;white-space:nowrap}
.pill{border:1.5px solid #e5e5e5;background:#fff;padding:5px 13px;border-radius:20px;font-size:12px;cursor:pointer;color:#666;white-space:nowrap;transition:all .12s}
.pill.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.sep{width:1px;background:#ece9e4;height:20px;flex-shrink:0}

/* Grid */
.grid-wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
.count{font-size:12px;color:#aaa;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr}}

/* Card tile — shows the actual card image */
.tile{border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.07);transition:transform .13s,box-shadow .13s;position:relative}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.11)}
.tile-img{width:100%;display:block;background:#ece9e4}
.tile-img img{width:100%;display:block;object-fit:cover}
.tile-bar{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.tile-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:#f0ede6;padding:3px 8px;border-radius:4px;font-size:11px;color:#777}
.tile-share{background:none;border:none;color:#1a7340;font-size:12px;cursor:pointer;padding:3px 6px;border-radius:4px}
.tile-share:hover{background:#f0faf5}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:#ccc;grid-column:1/-1}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty p{font-size:13px;color:#bbb}

/* Upload modal — bottom sheet on mobile */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
@media(min-width:560px){.overlay{align-items:center}}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 18px 36px;max-height:90vh;overflow-y:auto;position:relative}
@media(min-width:560px){.sheet{border-radius:18px;padding:24px}}
.sheet-title{font-size:16px;font-weight:600;margin-bottom:4px}
.sheet-sub{font-size:12px;color:#aaa;margin-bottom:18px}
.close-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:22px;color:#ccc;cursor:pointer}

/* Drop zone */
.dz{border:2px dashed #ddd;border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;background:#fafaf8;margin-bottom:16px;transition:border-color .12s}
.dz.drag,.dz:hover{border-color:#c8a96e}
.dz p{color:#999;font-size:13px;margin-top:6px}
.dz small{color:#ccc;font-size:11px}
.dz input{display:none}

/* Queue */
.queue{display:flex;flex-direction:column;gap:14px}

/* Single upload card */
.ucard{background:#f8f7f4;border-radius:14px;overflow:hidden}
.ucard-img-wrap{position:relative}
.ucard-img{width:100%;display:block;max-height:240px;object-fit:contain;background:#ece9e4}
.ucard-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:16px;cursor:pointer;line-height:28px;text-align:center}
.ucard-tags{padding:12px 14px 0}
.ucard-tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.utag{border:1.5px solid #ddd;background:#fff;padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;color:#666;transition:all .12s;white-space:nowrap}
.utag.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.utag.price-tag.on{background:#c8a96e;border-color:#c8a96e;color:#fff}
.utag.auto{background:#c8a96e;border-color:#c8a96e;color:#fff}
.ucard-ocr{font-size:11.5px;color:#8a8175;padding:7px 0 3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.nb-flag{display:inline-block;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:600;background:#f0ece4;color:#8a8175}
.nb-flag.ok{background:#e4f4ea;color:#1e7a45}
.nb-flag.run{background:#e8eef6;color:#3a5a86}
.nb-flag.dup{background:#fdf1d8;color:#b08d3f}
.nb-flag.need{background:#fbe6e3;color:#c0392b}
.nb-strip{display:block;width:100%;border:1px solid #e8e2d6;border-radius:8px;margin:6px 0 2px;background:#fff}
.undo-btn{margin-top:9px;background:transparent;border:1px solid #ddd;color:#666;padding:11px;border-radius:12px;font-size:13px;cursor:pointer;width:100%;display:none}
.undo-btn.on{display:block}
#ocr-stat{font-size:12px;color:#8a8175;margin:2px 0 8px;text-align:center}
.ulabel{font-size:10px;color:#bbb;font-weight:600;letter-spacing:.4px;margin-bottom:5px;text-transform:uppercase}
.ucard-save{margin:12px 14px 14px;background:#1a1a1a;color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;width:calc(100% - 28px);display:block}
.ucard-save:hover{background:#333}

/* Batch save */
.batch-save{margin-top:14px;background:#1a1a1a;color:#fff;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;width:100%;display:none}
.batch-save.on{display:block}

/* Detail */
#detail{display:none}
#detail.on{display:block}
#pool.off{display:none}
.d-nav{background:#fff;padding:13px 18px;border-bottom:1px solid #ece9e4;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10}
.d-back{background:none;border:none;font-size:14px;cursor:pointer;color:#666}
.d-wrap{max-width:500px;margin:0 auto;padding:20px 16px 40px}
.d-img{width:100%;border-radius:16px;display:block;margin-bottom:18px}
.d-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.d-tag{background:#f0ede6;padding:5px 12px;border-radius:20px;font-size:13px;color:#666}
.d-share{background:#1a7340;color:#fff;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;width:100%}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:999}
.toast.on{opacity:1}

async function sbFetch(path, opts = {}) {
  const res = await fetch(SB_URL + path, {
    ...opts,
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
  return res;
}

// Upload image file to Supabase Storage, return public URL
async function uploadImage(file) {
  const ext = file.name.split('.').pop() || 'jpg';
  const filename = Date.now() + '-' + Math.random().toString(36).slice(2,6) + '.' + ext;
  const res = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${filename}`, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': file.type || 'image/jpeg',
      'x-upsert': 'false'
    },
    body: file
  });
  if (!res.ok) throw new Error('图片上传失败');
  return `${SB_URL}/storage/v1/object/public/${BUCKET}/${filename}`;
}

// Save property record to Supabase
async function sbSave(p) {
  const res = await sbFetch(`/rest/v1/${TABLE}`, {
    method: 'POST',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify({
      id: p.id,
      area: p.area,
      beds: p.beds,
      price: p.price,
      month: p.month,
      image_url: p.image_url,
      created_at: new Date().toISOString()
    })
  });
  if (!res.ok) throw new Error('数据保存失败');
  return res.json();
}

// Load all uploaded properties from Supabase
async function sbLoad() {
  const res = await sbFetch(`/rest/v1/${TABLE}?select=*&order=created_at.desc`);
  if (!res.ok) return [];
  return res.json();
}

// Delete property from Supabase
async function sbDelete(id) {
  await sbFetch(`/rest/v1/${TABLE}?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
}

// ── 入住时间 ───────────────────────────────────────────
// 筛选条以「当前月份」为基准自动向后滚动:现在 / 本月 / +1 / +2 / +3 / +4及以后
// 数据库里存绝对值 'YYYY-MM'(或 'now'),所以不会随时间失真;
// 旧数据里的 '7' '8' '9' '10+' 会被当作 2026 年对应月份读入。
function mKey(y, m) { return y + '-' + String(m).padStart(2, '0'); }

function monthSlots() {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth() + 1;
  const at = i => {
    const mm = ((m - 1 + i) % 12) + 1, yy = y + Math.floor((m - 1 + i) / 12);
    return { m: mm, y: yy, k: mKey(yy, mm), label: (yy > y ? '明年' : '') + mm + '月' };
  };
  const out = [{ k: 'now', label: '现在' }];
  for (let i = 0; i < 4; i++) out.push(at(i));
  const last = at(4);
  out.push({ k: last.k + '+', from: last.k, label: last.label + '+' });
  return out;
}
const MONTH_SLOTS = monthSlots();

function normMonth(v) {
  if (v == null || v === '') return null;
  v = String(v);
  if (/^now$/i.test(v)) return 'now';
  if (/^\d{4}-\d{2}/.test(v)) return v.slice(0, 7);
  const n = parseInt(v, 10);               // 旧数据 '7' '8' '9' '10+'
  if (!n) return 'now';
  return mKey(2026, n);
}

function monthLabelOf(v) {
  const k = normMonth(v);
  if (!k) return '';
  if (k === 'now') return '现在';
  for (const s of MONTH_SLOTS) {
    if (s.k === 'now') continue;
    if (s.from ? k >= s.from : s.k === k) return s.label;
  }
  const yy = parseInt(k.slice(0, 4), 10), mm = parseInt(k.slice(5), 10);
  return (yy > new Date().getFullYear() ? '明年' : '') + mm + '月';
}

function monthMatch(v, slotKey) {
  if (slotKey === 'all') return true;
  const k = normMonth(v);
  if (!k) return false;
  if (slotKey === 'now' || k === 'now') return k === slotKey;
  const s = MONTH_SLOTS.find(x => x.k === slotKey);
  if (!s) return false;
  return s.from ? k >= s.from : k === s.k;
}

// "24/07/2026" / "Now" -> 月份键。按「日」比较:今天或更早才算「现在」,
// 所以本月稍后才能入住的房子会正确落到本月那一格,而不是被吞进「现在」。
function availMonth(avail) {
  if (!avail || /now/i.test(avail)) return 'now';
  const m = avail.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (!m) return 'now';
  let y = parseInt(m[3], 10); if (y < 100) y += 2000;
  const mo = parseInt(m[2], 10), day = parseInt(m[1], 10);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const d = new Date(y, mo - 1, day);
  if (isNaN(d.getTime())) return 'now';
  return d <= t ? 'now' : mKey(y, mo);
}

function renderMonthPills() {
  const box = document.getElementById('month-pills');
  if (!box) return;
  box.innerHTML = '<button class="pill on" data-mk="all">全部</button>' +

  box.querySelectorAll('.pill').forEach(b => {
    b.onclick = () => filt('month', b.dataset.mk, b);

// Map postcode prefix to area
function pc2area(pc) {
  if (!pc) return 'city';
  pc = pc.trim().toUpperCase();
  // City: EC, WC, W1x, SW1x, SE1 (单独一位数字或结尾), N1, E1 市中心区
  // 注意：W1/SW1/SE1 后面如果跟两位数(如SW11, SE17)则是南伦敦，不是市中心
  if (/^(EC|WC)/.test(pc)) return 'city';
  if (/^W1[A-Z]/.test(pc)) return 'city';       // W1A, W1B, W1C...W1W (Mayfair/Soho)
  if (/^SW1[A-Z]/.test(pc)) return 'city';      // SW1A, SW1P, SW1V... (Westminster)
  if (/^SE1\b/.test(pc) || /^SE1[A-Z]/.test(pc)) return 'city';  // SE1 (Southwark/Borough)
  if (/^(N|NW)/.test(pc)) return 'north';
  if (/^E/.test(pc)) return 'east';
  if (/^(SW|SE)/.test(pc)) return 'south';
  if (/^W/.test(pc)) return 'west';
  return 'city';
}

const AREA_LABEL = {city:'市中心', north:'北伦敦', east:'东伦敦', west:'西伦敦', south:'南伦敦'};

async function loadAll() {
  // Load uploaded cards from Supabase (all devices) + fallback to localStorage
  let uploaded = [];
  try {
    const rows = await sbLoad();
    uploaded = rows.map(r => ({
      id: r.id,
      isUploaded: true,
      area: r.area,
      beds: r.beds,
      price: r.price,
      month: r.month,
      displayImg: r.image_url,
      uploadedAt: r.created_at
    }));
  } catch(e) {
    // Supabase unavailable, fall back to localStorage
    uploaded = JSON.parse(localStorage.getItem('niko-cards') || '[]');
  }
  allProps = [...uploaded, ...BUILT_IN.map(p => ({
    ...p, isBuiltIn: true,
    price: priceRange(p.weekly),
    month: availMonth(p.avail),
    area: pc2area(p.postcode),
    displayImg: p.images[0]
  }))];
  render();
}

function getFiltered() {
  return allProps.filter(p => {
    if (F.area !== 'all' && p.area !== F.area) return false;
    if (F.beds !== 'all') {
      const b = parseInt(F.beds);
      if (b === 3 && p.beds < 3) return false;
      if (b < 3 && p.beds !== b) return false;
    }
    if (F.price !== 'all' && p.price !== F.price) return false;
    if (!monthMatch(p.month, F.month)) return false;
    return true;
  });
}

function render() {
  const list = getFiltered();
  document.getElementById('count').textContent = `共 ${list.length} 套`;
  const g = document.getElementById('grid');
  if (!list.length) {
    g.innerHTML = '<div class="empty"><div class="empty-icon">🏠</div><p>没有符合条件的房源</p></div>';
    return;
  }
  g.innerHTML = list.map(p => {
    const img = p.displayImg || (p.images && p.images[0]);
    const areaLabel = AREA_LABEL[p.area] || '';
    const bedsLabel = p.beds === 0 ? 'Studio' : (p.beds || 2) + '室';
    const priceLabel = p.weekly ? `£${p.weekly}/周` : (p.price === 'low' ? '≤£700' : p.price === 'high' ? '≥£1000' : '£700-1000');
    const monthLabel = monthLabelOf(p.month);
    return `<div class="tile" onclick="showDetail('${p.id}')">
      <div class="tile-img">
        ${img ? `<img src="${img}" loading="lazy" onerror="this.parentNode.style.minHeight='120px'">` : '<div style="min-height:140px;background:#ece9e4"></div>'}
      </div>
      <div class="tile-bar">
        <div class="tile-tags">
          ${areaLabel ? `<span class="tag">${areaLabel}</span>` : ''}
          <span class="tag">${bedsLabel}</span>
          ${priceLabel ? `<span class="tag">${priceLabel}</span>` : ''}
          ${monthLabel ? `<span class="tag">${monthLabel}</span>` : ''}
        </div>
        <button class="tile-share" onclick="event.stopPropagation();share('${p.id}')">↗</button>
      </div>
    </div>`;
  }).join('');
}

function filt(type, val, el) {
  F[type] = val;
  el.parentNode.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  render();
}

function handleFiles(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  arr.forEach(file => {
    const id = 'u' + Date.now() + Math.random().toString(36).slice(2,5);
    const objectUrl = URL.createObjectURL(file);
    const entry = { id, file, objectUrl, dataUrl: null, area: null, beds: null, price: null, month: null };
    batchQ.push(entry);
    appendCard(entry);
    // Also load a compressed dataUrl for saving
    compressForSave(file).then(du => {
      entry.dataUrl = du;
      // Show preview using dataUrl (works everywhere, no blob URL issues)
      const imgEl = document.getElementById('img-' + entry.id);
      const phEl = document.getElementById('ph-' + entry.id);
      if (imgEl && du) {
        imgEl.src = du;
        imgEl.style.display = 'block';
        if (phEl) phEl.style.display = 'none';
      }
    });
  });
  if (batchQ.length > 1) document.getElementById('batch-save').classList.add('on');
  if (arr.length) autoTagAll(batchQ.slice(-arr.length));
}

function compressForSave(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
          else { w = Math.round(w*MAX/h); h = MAX; }
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(ev.target.result);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function utagRow(id, key, opts, extra) {
  return opts.map(o =>
    '<button class="utag ' + (extra || '') + '" data-k="' + key + '" data-v="' + o[0] +
    '" onclick="tagSelect(\'' + id + '\',\'' + key + '\',\'' + o[0] + '\',this)">' + o[1] + '</button>'
  ).join('');
}

// 由自动识别填进去的值,标成金色;用户一点就变回黑色(表示人工确认过)
function markTag(entry, key, val, auto) {
  entry[key] = (key === 'beds') ? parseInt(val, 10) : val;
  const card = document.getElementById(entry.id);
  if (!card) return;
  let b = card.querySelector('.utag[data-k="' + key + '"][data-v="' + val + '"]');
  if (!b && key === 'month') {                       // 例如 '2027-03' 落进「明年2月+」
    const slot = MONTH_SLOTS.find(s => monthMatch(val, s.k));
    if (slot) b = card.querySelector('.utag[data-k="month"][data-v="' + slot.k + '"]');
  }
  if (!b) return;
  b.closest('.ucard-tags-row').querySelectorAll('.utag')
    .forEach(x => { x.classList.remove('on'); x.classList.remove('auto'); });
  b.classList.add(auto ? 'auto' : 'on');
}

function appendCard(entry) {
  const qEl = document.getElementById('queue');

  div.className = 'ucard'; div.id = entry.id;

  div.innerHTML = `
    <div class="ucard-img-wrap">

      <img class="ucard-img" id="img-${entry.id}" src="" style="display:none">
      <button class="ucard-del" onclick="removeCard('${entry.id}')">×</button>
    </div>
    <div class="ucard-ocr" id="ocr-${entry.id}"><span class="nb-flag run">识别中…</span></div>
    <img class="nb-strip" id="strip-${entry.id}" style="display:none">
    <div class="ucard-tags">
      <div class="ulabel">位置</div>
      <div class="ucard-tags-row">
        ${utagRow(entry.id,'area',[['city','市中心'],['north','北伦敦'],['east','东伦敦'],['west','西伦敦'],['south','南伦敦']])}
      </div>
      <div class="ulabel">户型</div>
      <div class="ucard-tags-row">
        ${utagRow(entry.id,'beds',[['0','Studio'],['1','1室'],['2','2室'],['3','3室+']])}
      </div>
      <div class="ulabel">价格范围</div>
      <div class="ucard-tags-row">
        ${utagRow(entry.id,'price',[['low','≤£700/周'],['mid','£700-1000'],['high','≥£1000/周']],'price-tag')}
      </div>
      <div class="ulabel">入住时间</div>
      <div class="ucard-tags-row">
        ${utagRow(entry.id,'month',MONTH_SLOTS.map(s=>[s.k,s.label]))}
      </div>
    </div>
    <button class="ucard-save" onclick="saveSingle('${entry.id}')">保存到房源池</button>
  `;
  qEl.appendChild(div);
}

function tagSelect(id, key, val, el) {
  const entry = batchQ.find(x => x.id === id);
  if (entry) {
    // beds must be stored as integer (0 = Studio), other fields stay as string
    entry[key] = (key === 'beds') ? parseInt(val, 10) : val;
  }
  el.closest('.ucard-tags-row').querySelectorAll('.utag')
    .forEach(b => { b.classList.remove('on'); b.classList.remove('auto'); });
  el.classList.add('on');
  if (entry) refreshOcrLine(entry);
}

function removeCard(id) {
  const entry = batchQ.find(x => x.id === id);
  if (entry && entry.objectUrl) URL.revokeObjectURL(entry.objectUrl);
  batchQ = batchQ.filter(x => x.id !== id);
  document.getElementById(id)?.remove();
  if (batchQ.length <= 1) document.getElementById('batch-save').classList.remove('on');
}


// ── 自动识别(OCR) + 去重 ────────────────────────────────
// 海报是固定模板:顶部有日期条,中间有「户型/入住/家具/邮编」四个格和周租。
// 裁出这两块分别 OCR,再解析成 area / beds / price / month 四个字段。
let AUTO_RUNNING = false, AUTO_SAVED = [], OCR_WORKER = null;
let POOL_HASH = new Map(), HASH_BUILDING = null;

const NB_KW = {
  east:  ['stratford','towerhamlets','wardian','canarywharf','isleofdogs','hackney','shoreditch','whitechapel','aldgate','wapping','poplar','bethnalgreen','limehouse'],
  city:  ['cityroad','aldwych','strand','holborn','bloomsbury','clerkenwell','farringdon','barbican','moorgate','soho','mayfair','marylebone','fitzrovia','coventgarden'],
  north: ['islington','camden','angel','highbury','kentishtown','finsburypark','archway','hampstead'],
  west:  ['kensington','chelsea','fulham','nottinghill','paddington','hammersmith','earlscourt','maidavale'],
  south: ['battersea','vauxhall','clapham','brixton','peckham','bermondsey','southwark','waterloo','elephant','nineelms','kennington']
};

function ocrStat(t) { const e = document.getElementById('ocr-stat'); if (e) e.textContent = t || ''; }

function nbLoadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image(); i.crossOrigin = 'anonymous';
    i.onload = () => res(i); i.onerror = () => rej(new Error('图片读取失败')); i.src = src;
  });
}

function nbCrop(img, a, b, sc) {
  const y0 = Math.round(img.naturalHeight * a), y1 = Math.round(img.naturalHeight * b);
  const c = document.createElement('canvas');
  c.width = img.naturalWidth * sc; c.height = (y1 - y0) * sc;
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
  x.drawImage(img, 0, y0, img.naturalWidth, y1 - y0, 0, 0, c.width, c.height);
  return c;
}

function nbDhash(img) {
  const c = document.createElement('canvas'); c.width = 9; c.height = 8;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, 9, 8);
  const d = x.getImageData(0, 0, 9, 8).data; let bits = '';
  for (let r = 0; r < 8; r++) for (let k = 0; k < 8; k++) {
    const i = (r * 9 + k) * 4, j = (r * 9 + k + 1) * 4;
    const A = d[i]*.299 + d[i+1]*.587 + d[i+2]*.114;
    const B = d[j]*.299 + d[j+1]*.587 + d[j+2]*.114;
    bits += A > B ? '1' : '0';
  }
  return bits.match(/.{8}/g).map(v => parseInt(v, 2).toString(16).padStart(2, '0')).join('');
}

function buildHashIndex() {
  if (HASH_BUILDING) return HASH_BUILDING;
  const rows = allProps.filter(p => p.isUploaded && p.displayImg);
  let i = 0, done = 0;
  const run = async () => {
    while (i < rows.length) {
      const r = rows[i++];
      try { const im = await nbLoadImg(r.displayImg); const h = nbDhash(im); if (!POOL_HASH.has(h)) POOL_HASH.set(h, r.id); } catch (e) {}
      done++; if (done % 30 === 0) ocrStat('正在建立去重索引 ' + done + '/' + rows.length);
    }
  };
  HASH_BUILDING = Promise.all(Array.from({ length: 8 }, run)).then(() => ocrStat(''));
  return HASH_BUILDING;
}

function nbPcArea(p) {
  p = p.toUpperCase().replace(/I/g, '1').replace(/O/g, '0');
  if (/^EC\d/.test(p) || /^WC\d/.test(p)) return 'city';
  if (/^W1$/.test(p) || /^SW1$/.test(p)) return 'city';
  if (/^NW/.test(p) || /^N\d/.test(p)) return 'north';
  if (/^E\d/.test(p)) return 'east';
  if (/^SE/.test(p)) return 'south';
  if (/^SW(3|5|6|7|10)$/.test(p)) return 'west';
  if (/^SW/.test(p)) return 'south';
  if (/^W\d/.test(p)) return 'west';
  return null;
}

function nbAreaFromName(n) {
  const b = n.replace(/\.[a-z0-9]+$/i, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const m = b.match(/(ec\d[a-z]?|wc\d[a-z]?|nw\d{1,2}|sw\d{1,2}|se\d{1,2}|[new]\d{1,2})$/);
  if (m) { const a = nbPcArea(m[1]); if (a) return a; }
  for (const k in NB_KW) for (const w of NB_KW[k]) if (b.indexOf(w) >= 0) return k;
  return null;
}

// 周租常被 OCR 漏读,只剩月租;月租 ≈ 周租 × 4.33,据此还原
function nbWeekly(ns) {
  ns = ns.filter(n => n >= 80 && n <= 20000).sort((a, b) => a - b);
  if (!ns.length) return null;
  for (const a of ns) for (const b of ns) if (b > a && b / a >= 4.0 && b / a <= 4.7) return a;
  return ns[0] > 1800 ? Math.round(ns[0] * 12 / 52) : ns[0];
}

function nbParse(tTop, tLow) {
  const out = {};
  const lines = tLow.split('\n').filter(l => l.trim());
  let spec = null;
  for (const l of lines) if (/\d{1,2}\/\d{1,2}\//.test(l) || /(^|\s)Now(\s|$)/i.test(l)) { spec = l; break; }
  // 户型只从规格那一行读,否则「Fitness Studio」之类的配套标签会被误判成 Studio
  const s = spec || tLow;
  if (/studio/i.test(s)) out.beds = 0;
  else { const m = s.match(/(\d)\s*Bed/i); if (m) out.beds = parseInt(m[1], 10); }
  const all = tTop + '\n' + tLow;
  if (/(^|\s)Now(\s|$)/i.test(all)) out.month = 'now';
  else {
    const d = tTop.match(/\b\d{1,2}\/\d{1,2}\/\d{4}\b/) || tLow.match(/\b\d{1,2}\/\d{1,2}\/\d{4}\b/);
    if (d) out.month = availMonth(d[0]);
  }
  const ns = []; const re = /£\s?([\d,]{3,7})/g; let x;
  while ((x = re.exec(tLow)) !== null) ns.push(parseInt(x[1].replace(/,/g, ''), 10));
  const wk = nbWeekly(ns);
  if (wk) { out.price = priceRange(wk); out.weekly = wk; }
  if (spec) { const pm = spec.match(/\b([A-Z]{1,2}[0-9I][0-9A-Z]?)\s*$/); if (pm) out.pc = pm[1]; }
  return out;
}

function nbWorker() {
  if (OCR_WORKER) return Promise.resolve(OCR_WORKER);
  const load = window.Tesseract ? Promise.resolve() : new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload = res; s.onerror = () => rej(new Error('OCR 库加载失败'));
    document.head.appendChild(s);
  });
  return load.then(() => Tesseract.createWorker('eng')).then(w => { OCR_WORKER = w; return w; });
}

function refreshOcrLine(e) {
  const el = document.getElementById('ocr-' + e.id);
  if (!el) return;
  if (!e.ocrDone) { el.innerHTML = '<span class="nb-flag run">识别中…</span>'; return; }
  const full = e.area != null && e.beds != null && e.price != null && e.month != null;
  const bits = [];
  if (e.dupe) bits.push('<span class="nb-flag dup">池中已有</span>');
  else if (full) bits.push('<span class="nb-flag ok">已识别</span>');
  else bits.push('<span class="nb-flag need">需补选</span>');
  if (e.weekly) bits.push('£' + e.weekly + '/周');
  if (e.month) bits.push(monthLabelOf(e.month) + '入住');
  el.innerHTML = bits.join('&nbsp; ');
}

async function autoTagAll(entries) {
  AUTO_RUNNING = true;
  let saved = 0, need = 0, dup = 0, n = 0;
  try {
    ocrStat('准备自动识别…');
    await buildHashIndex();
    const wk = await nbWorker();
    for (const e of entries) {
      if (!batchQ.find(x => x.id === e.id)) continue;   // 已被删掉
      n++; ocrStat('识别中 ' + n + '/' + entries.length);
      try {
        const img = await nbLoadImg(e.objectUrl);
        const h = nbDhash(img); e.hash = h;
        if (POOL_HASH.has(h)) e.dupe = true; else POOL_HASH.set(h, e.id);
        try {
          const st = document.getElementById('strip-' + e.id);
          if (st) { st.src = nbCrop(img, .505, .79, 1).toDataURL('image/jpeg', .82); st.style.display = 'block'; }
        } catch (err) {}
        const a = nbAreaFromName(e.file.name);
        if (a && e.area == null) markTag(e, 'area', a, true);
        const t1 = await wk.recognize(nbCrop(img, 0, .09, 2));
        const t2 = await wk.recognize(nbCrop(img, .50, .85, 2));
        const r = nbParse(t1.data.text, t2.data.text);
        if (r.beds != null && e.beds == null) markTag(e, 'beds', String(r.beds), true);
        if (r.price && e.price == null) markTag(e, 'price', r.price, true);
        if (r.month && e.month == null) markTag(e, 'month', r.month, true);
        if (e.area == null && r.pc) { const a2 = nbPcArea(r.pc); if (a2) markTag(e, 'area', a2, true); }
        e.weekly = r.weekly || null;
      } catch (err) {}
      e.ocrDone = true;
      refreshOcrLine(e);
      const full = e.area != null && e.beds != null && e.price != null && e.month != null;
      if (e.dupe) { dup++; }
      else if (full) { await saveSingle(e.id); saved++; }
      else { need++; }
    }
    const msg = [];
    if (saved) msg.push('已自动上传 ' + saved + ' 套');
    if (dup) msg.push('重复跳过 ' + dup + ' 套');
    if (need) msg.push(need + ' 套待补选后保存');
    ocrStat(msg.join(' · ') || '');
    if (saved) {
      const ub = document.getElementById('undo-btn');
      if (ub) { ub.classList.add('on'); ub.textContent = '撤销本次自动上传（' + AUTO_SAVED.length + ' 套）'; }
      toast('已自动上传 ' + saved + ' 套 ✓');
    }
  } catch (err) {
    ocrStat('自动识别不可用：' + err.message + '，可手动点选后保存');
  }
  AUTO_RUNNING = false;
  if (!batchQ.length && !AUTO_SAVED.length) closeUpload();
}

async function undoAuto() {
  if (!AUTO_SAVED.length) return;
  if (!confirm('撤销本次自动上传的 ' + AUTO_SAVED.length + ' 套房源？撤销后需要重新上传。')) return;
  const btn = document.getElementById('undo-btn');
  btn.disabled = true; btn.textContent = '撤销中…';
  let n = 0;
  for (const id of AUTO_SAVED.slice()) {
    try { await sbDelete(id); allProps = allProps.filter(p => p.id !== id); n++; } catch (e) {}
  }
  AUTO_SAVED = [];
  btn.disabled = false; btn.classList.remove('on'); btn.textContent = '撤销本次自动上传';
  render(); toast('已撤销 ' + n + ' 套');
}

async function saveSingle(id) {
  const entry = batchQ.find(x => x.id === id);
  if (!entry) return;

  // Validate: all four tags must be selected before saving
  const missing = [];
  if (entry.area == null) missing.push('位置');
  if (entry.beds == null) missing.push('户型');
  if (entry.price == null) missing.push('价格');
  if (entry.month == null) missing.push('入住时间');
  if (missing.length) { toast('请先选择：' + missing.join(' / ')); return; }

  if (!entry.file) { toast('图片加载中，请稍候再试'); return; }

  const btn = document.querySelector(`#${id} .ucard-save`);
  if (btn) { btn.disabled = true; btn.textContent = '上传中…'; }

  try {
    // 1. Upload image to Supabase Storage
    const imageUrl = await uploadImage(entry.file);

    // 2. Save record to Supabase database
    const recId = 'card-' + Date.now() + '-' + Math.random().toString(36).slice(2,5);
    await sbSave({
      id: recId,
      area: entry.area,
      beds: entry.beds,
      price: entry.price,
      month: entry.month,
      image_url: imageUrl
    });

    // 3. Update local display
    const p = {
      id: recId,
      isUploaded: true,
      area: entry.area,
      beds: entry.beds,
      price: entry.price,
      month: entry.month,
      displayImg: imageUrl,
      uploadedAt: new Date().toISOString()
    };
    allProps.unshift(p);
    render();
    removeCard(id);
    if (!batchQ.length && !AUTO_RUNNING) closeUpload();
    if (!AUTO_RUNNING) toast('已保存 ✓');
    else AUTO_SAVED.push(recId);        // 只有自动上传的才进撤销名单
  } catch(e) {
    toast('保存失败，请重试');
    if (btn) { btn.disabled = false; btn.textContent = '保存到房源池'; }
  }
}

async function saveAll() {
  const ids = batchQ.map(x => x.id);
  for (const id of ids) { await saveSingle(id); }
}

// ── ROUTING ──────────────────────────────────────────────
window.addEventListener('popstate', () => {
  if (location.hash.startsWith('#/p/')) showDetail(location.hash.slice(4));
  else showPool();
});

(async () => {
  renderMonthPills();
  await loadAll();
  applyAdminUI();
  if (location.hash.startsWith('#/p/')) showDetail(location.hash.slice(4));
})();
</script>
